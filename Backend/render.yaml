services:
  - type: web
    name: ai-research-flow-api
    env: python
    region: frankfurt
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: sh start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: DATABASE_URL
        sync: false
      - key: SYNC_DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: AI_DATA_TRANSMISSION_POLICY_APPROVED
        value: true
      - key: AI_STRIP_PARTICIPANT_IDENTIFIERS
        value: true
      - key: CORS_ORIGINS
        value: "http://localhost:3000,http://localhost:5173"

